name: Build iOS (unsigned)

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'  # ← КОНКРЕТНАЯ ВЕРСИЯ
      - name: Disable code signing for Release
        run: |
          cd family_storage
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_ENTITLEMENTS=" >> ios/Flutter/Release.xcconfig
      - name: Get packages
        run: |
          cd family_storage
          flutter pub get
      - name: Build .app (unsigned)
        run: |
          cd family_storage
          flutter build ios --release --no-codesign
      - name: Package .app into .ipa
        run: |
          cd family_storage/build/ios
          mkdir -p Payload
          cp -r Release-iphoneos/Runner.app Payload/
          zip -r ipa.zip Payload/
          mkdir -p ../ipa
          mv ipa.zip ../ipa/
      - uses: actions/upload-artifact@v4
        with:
          name: IPA-unsigned
          path: family_storage/build/ios/ipa/ipa.zip
