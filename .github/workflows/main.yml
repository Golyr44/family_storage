name: Build iOS (unsigned)

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'

      - name: Remove code signing from project.pbxproj
        run: |
          cd family_storage/ios/Runner.xcodeproj
          # Делаем резервную копию
          cp project.pbxproj project.pbxproj.bak
          # Удаляем строки с подписью
          sed -i '' '/CODE_SIGN/d' project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM/d' project.pbxproj
          sed -i '' '/PROVISIONING_PROFILE/d' project.pbxproj
          echo "✅ Подпись удалена"

      - name: Get packages
        run: |
          cd family_storage
          flutter pub get

      - name: Build .app (unsigned)
        run: |
          cd family_storage
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          cd family_storage/build/ios
          mkdir -p Payload
          cp -r Release-iphoneos/Runner.app Payload/
          zip -r ipa.zip Payload/
          mkdir -p ../ipa
          mv ipa.zip ../ipa/

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-unsigned
          path: family_storage/build/ios/ipa/ipa.zip
